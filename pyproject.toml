[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "capcut-mcp"
version = "0.1.0"
description = "Unofficial MCP server that lets AI assistants (Claude etc.) build and edit CapCut desktop drafts"
readme = "README.md"
license = "MIT"
authors = [{ name = "Olzhas Smagulov" }]
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pycapcut>=0.0.4",
    "mcp>=2",
]
keywords = ["mcp", "capcut", "video-editing", "claude", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
capcut-mcp = "capcut_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/capcut_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
